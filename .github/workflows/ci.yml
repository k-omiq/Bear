name: CI

# Lightweight gate: frontend build plus Rust check/clippy/test on both shipped
# platforms. Deliberately skips the heavy ML model downloads and the ONNX
# Runtime download - this proves the surfaces build and that the logic tests
# pass, not that detection/inpainting runs (that needs the model weights + a
# real desktop app). The Rust suites are written to skip, loudly, when the
# weights or the runtime are absent, which is the state of every runner here.
#
# Windows is a first-class job rather than something a tagged release finds
# out about. Several `#[cfg(windows)]` paths exist - `GlobalMemoryStatusEx` in
# crates/cleaner-core/src/memory.rs, `SetDllDirectoryW` in
# crates/cleaner-core/src/runtime/mod.rs - and before this job they were first
# compiled during a release build, at which point the only remedy on offer was
# to delete the tag and start again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vitest + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build

  python:
    name: Python (unittest + compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Five deploy/cloud test modules build their inputs with NumPy and
      # Pillow and fail at import without them. The pins are the analysis
      # image's own, from deploy/cloud/modal/app.py, so the tests see the
      # versions the worker runs. The heavy SDKs (modal, beam, torch) stay
      # out: their suites skip, loudly, which is what this gate is for.
      - name: Install NumPy and Pillow
        run: python3 -m pip install numpy==2.4.6 pillow==12.3.0
      - name: Run deploy/cloud unit tests
        run: python3 -m unittest discover -v -s deploy/cloud/tests
      - name: Run provisioner unit tests
        run: python3 -m unittest discover -v -s provisioner
      - name: Byte-compile deploy/cloud and provisioner
        run: python3 -m compileall deploy/cloud provisioner

  rust:
    name: Rust (check + clippy + test, linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri's crates link against webkit2gtk/gtk via pkg-config, so even
      # `cargo check` needs the desktop dev libraries on Linux. `libdbus-1-dev`
      # is there for `keyring`: its Linux features pull `dbus-secret-service`,
      # whose `libdbus-sys` build script asks pkg-config for `dbus-1`. That
      # resolves today only because another dependency happens to bring the
      # headers in, so it is named explicitly rather than relied on.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            curl wget file patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        run: cargo check --workspace --exclude spike-strip-memory
      - name: cargo clippy (deny warnings)
        run: cargo clippy -p cleaner-core -p manga-cleaner --no-deps --all-targets -- -D warnings
      # The same invocation README.md gives a developer, so a green CI and a
      # green checkout mean the same thing. `--test-threads=1` is there because
      # two WebGPU sessions initialised from two threads abort the test binary
      # on macOS; on a runner with no ONNX Runtime downloaded no session is
      # ever built, so the flag costs only wall time here and is kept for
      # parity rather than removed and later missed.
      - name: cargo test
        run: cargo test --workspace --exclude spike-strip-memory -- --test-threads=1

  rust-windows:
    name: Rust (check + clippy + test, windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      # Same caching pattern as the Linux job, with a key of its own so the
      # two do not fight over one cache entry.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc
      # `--target` is redundant on an x64 runner and named anyway: it keeps the
      # job honest about which triple it covers if the hosted image ever
      # changes architecture underneath it.
      - name: cargo check
        run: cargo check --workspace --exclude spike-strip-memory --target x86_64-pc-windows-msvc
      - name: cargo clippy (deny warnings)
        run: cargo clippy -p cleaner-core -p manga-cleaner --no-deps --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude spike-strip-memory --target x86_64-pc-windows-msvc -- --test-threads=1
      # The release build copies the Visual C++ 2015-2022 runtime out of the
      # Visual Studio redistributable tree and ships it beside the executable,
      # because the downloaded ONNX Runtime imports it and a clean Windows does
      # not have it. That tree's location is a property of the runner image, so
      # it is checked here on every pull request. Without this, a runner image
      # that moved the files would be discovered during a tagged release, which
      # is the failure mode this whole job exists to remove.
      - name: Visual C++ redistributable is where the release build expects it
        shell: pwsh
        run: .github/scripts/stage-vc-runtime.ps1 -VerifyOnly
