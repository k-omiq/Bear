name: Release

# Builds installers for macOS (Apple Silicon), Windows x64, and Linux x64,
# then publishes them
# plus latest.json to the R2 bucket behind https://cleaner.komiq.cc via
# the publish worker at https://cleaner-publish.komiq.cc.
# Installed apps poll that URL and offer the update in-app.
#
# Trigger: push a tag like v0.1.0 (tag message becomes the release notes),
# or run manually with workflow_dispatch and type the notes. Manual runs can
# set validate_only to build and inspect artifacts without publishing them.
# Prerelease tags
# such as v1.0.0-beta.1 are ordinary tags here; scripts/ship.sh knows how to
# order them.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY  - content of the updater signing key. This is
#                                the minisign key the updater checks, and has
#                                nothing to do with Authenticode.
#   CLEANER_PUBLISH_TOKEN      - bearer token for https://cleaner-publish.komiq.cc
#
# Optional repo secrets, for Windows Authenticode signing. Set BOTH or
# NEITHER. While they are unset the Windows installer is unsigned and every
# user meets a SmartScreen "Windows protected your PC" warning; setting them
# turns signing on with no further edit to this file.
#   WINDOWS_CERTIFICATE          - the .pfx, base64 encoded:
#                                  certutil -encode certificate.pfx cert.txt
#   WINDOWS_CERTIFICATE_PASSWORD - the .pfx export password
#
# Optional repo secrets, for a stable macOS code signature. Set all THREE or
# NONE. While they are unset the app is ad-hoc signed, which names each build
# by its own code hash: the login keychain then treats every update as a
# stranger to the cloud token the previous build saved, and macOS asks for the
# login password the first time the updated app uses it. Any certificate that
# stays the same from release to release fixes that, including a self-signed
# "Code Signing" certificate made in Keychain Access; a Developer ID
# certificate also clears Gatekeeper. Tauri reads these three names itself.
#   APPLE_CERTIFICATE            - the .p12, base64 encoded: base64 -i cert.p12
#   APPLE_CERTIFICATE_PASSWORD   - the .p12 export password
#   APPLE_SIGNING_IDENTITY       - the certificate's common name, e.g.
#                                  "Developer ID Application: Name (TEAMID)"
#
# Optional repo *variable* (Settings > Secrets and variables > Actions >
# Variables), not a secret, because a timestamp server URL is public:
#   WINDOWS_TIMESTAMP_URL        - RFC 3161 timestamp server. Defaults to
#                                  http://timestamp.digicert.com. A timestamp
#                                  is what keeps an installer trusted after
#                                  the certificate expires, so it is always
#                                  requested.
#
# ## The two Windows installer decisions, and why they are now written down
#
# tauri.conf.json is plain JSON and cannot carry a comment, so the reasoning
# for `bundle.windows` lives here. Both settings were previously absent, which
# meant the shipped installer's behaviour was a Tauri default nobody had
# chosen.
#
#   nsis.installMode: "currentUser"
#     Matches the Tauri default, and is right for this application rather than
#     merely convenient: everything large it needs (the ONNX Runtime, and up
#     to 460 MB of model weights) is downloaded after installation into the
#     per-user app data directory, so a machine-wide install would share
#     nothing worth sharing. It also keeps the installer out of the elevation
#     prompt, which matters twice over because the in-app updater re-runs this
#     same installer on every update.
#
#   webviewInstallMode: downloadBootstrapper, silent
#     Also the Tauri default. WebView2 is part of the operating system at the
#     platform floor below, so on a supported machine the bootstrapper never
#     runs and the alternatives would only add weight: embedBootstrapper costs
#     about 1.8 MB and offlineInstaller about 127 MB to cover a Windows that
#     this application does not support anyway. The cost of the choice is that
#     a machine that somehow lacks WebView2 needs a network connection at
#     install time, which it needs on first launch regardless to fetch the
#     runtime and the weights.
#
# ## Windows platform floor
#
# There is no Windows counterpart to bundle.macOS.minimumSystemVersion in the
# Tauri 2 schema, so the floor is recorded here instead. It is **Windows 10
# version 1803 x64 or newer**, and three separate things imply it:
#
#   - WebView2 is part of the operating system from Windows 10 1803 onward.
#     Below that the NSIS installer would have to fetch and run Microsoft's
#     bootstrapper for the app to open a window at all.
#   - The Visual C++ 2015-2022 runtime shipped beside the executable (see the
#     staging step below) is built by the current Visual Studio toolset, which
#     Microsoft supports on Windows 10 and later. It also depends on the
#     Universal CRT, which is an operating system component from Windows 10
#     and a separate update on anything older.
#   - ONNX Runtime 1.28, which every model session runs on, is built for
#     Windows 10 and later.
#
# Only x86_64 is built. crates/cleaner-core/src/runtime/package.rs carries a
# complete win-arm64 package row and it is deliberately unused: no arm64
# Windows machine has ever run this application, none of the DirectML or
# WebGPU numbers in the acceleration table were measured on one, and shipping
# an installer that has never been built is worse than shipping none. The row
# stays because it is the correct description of the package that would be
# needed, not because a build is imminent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown in the in-app update dialog"
        required: false
        default: ""
      validate_only:
        description: "Build and inspect installers without publishing to R2"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          # No intel mac: ort-sys ships no prebuilt onnxruntime for
          # x86_64-apple-darwin, so the target cannot build.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux desktop build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev build-essential curl wget file patchelf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci

      # Both provider SDKs and PyInstaller, every package pinned and hash-checked.
      - name: Install pinned cloud helper build dependencies
        shell: bash
        run: python -m pip install --require-hashes -r provisioner/requirements.lock

      # Freezes the helper, smoke tests it offline (self check, missing and
      # unreachable credentials) and adds it to bundle.externalBin. The helper
      # carries the Modal SDK, so a new computer needs no Python or Modal of its
      # own. A validation run also signs in to the real Modal API with an
      # unknown token (--online) on each OS; a tagged release does not, so a
      # Modal outage cannot block it.
      - name: Freeze and smoke-test cloud setup helper
        shell: bash
        run: python .github/scripts/build-cloud-provisioner.py '${{ matrix.target }}' ${{ inputs.validate_only == true && '--online' || '' }}

      - name: Bundle managed Python installer for FLUX
        shell: bash
        run: |
          python -m pip install uv==0.12.19
          python .github/scripts/stage-flux-python.py '${{ matrix.target }}'

      # The ONNX Runtime the application downloads on first launch imports
      # MSVCP140.dll, MSVCP140_1.dll, VCRUNTIME140.dll and VCRUNTIME140_1.dll
      # in its ordinary import table. A clean Windows has none of them, and
      # nothing in the download supplies them, so without this step the
      # application installs and can then do nothing at all: the runtime fails
      # to load with Windows error 126.
      #
      # These are copied into src-tauri/vendor/windows-crt, which
      # tauri.conf.json bundles with the resource glob "vendor/windows-crt/*"
      # mapped to "", so each file lands loose in the install directory beside
      # the executable. That is where it has to be: onnxruntime.dll is opened
      # by LoadLibraryExW with no LOAD_LIBRARY_SEARCH_* flags, so its own
      # imports resolve through the standard search order, whose first entry
      # is the directory the application was loaded from. A subdirectory would
      # not be searched, and neither would the runtime's own directory that
      # cleaner-core adds with SetDllDirectoryW.
      #
      # bundle.resources is not per-platform, which is why the directory holds
      # a committed note as well: Tauri treats a glob matching nothing as a
      # build error, and the macOS build has no DLLs to match.
      - name: Stage the Visual C++ runtime for app-local deployment
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: .github/scripts/stage-vc-runtime.ps1 -Destination src-tauri/vendor/windows-crt

      # Authenticode, gated on the secrets existing. Tauri reads the
      # certificate thumbprint from tauri.conf.json and from nowhere else - it
      # has no environment variable for it - so when a certificate is present
      # the configuration is patched in place for this build only. When it is
      # absent the build carries on and produces an unsigned installer, which
      # is what ships today.
      - name: Import the Windows code-signing certificate
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host '::warning::No WINDOWS_CERTIFICATE secret. The Windows installer will be UNSIGNED and users will see a SmartScreen warning. Set WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD to turn signing on.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE is set but WINDOWS_CERTIFICATE_PASSWORD is not; set both or neither.'
          }

          # certutil wants a file, and the decoded .pfx must not outlive the
          # import: a private key left in the workspace can be picked up by any
          # later step, including artifact upload.
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/cert.b64 -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/cert.b64 certificate/certificate.pfx
          if ($LASTEXITCODE -ne 0) { throw "certutil -decode failed ($LASTEXITCODE); is WINDOWS_CERTIFICATE the base64 of a .pfx?" }
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -Recurse -Force certificate

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) { $timestampUrl = 'http://timestamp.digicert.com' }

          # Patched rather than committed, so the repository never carries a
          # thumbprint that only one machine can satisfy and so a fork without
          # the certificate still builds.
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content -Raw -LiteralPath $configPath | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
          $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue $timestampUrl -Force
          $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8
          Write-Host "Signing with certificate $($cert.Thumbprint), timestamped by $timestampUrl"

      # The macOS certificate is handed to this step only, under names Tauri
      # does not read, and exported under the names it does read only when it
      # is present: Tauri treats a set-but-empty APPLE_CERTIFICATE as a
      # certificate to import and fails the build.
      - name: Build app
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -z "$MC_APPLE_CERTIFICATE" ] && [ -z "$MC_APPLE_CERTIFICATE_PASSWORD" ] && [ -z "$MC_APPLE_SIGNING_IDENTITY" ]; then
              echo '::warning::No APPLE_CERTIFICATE secret. The macOS app will be ad-hoc signed, so after each update macOS asks for the login password before the app can use its saved cloud token. Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY to keep one signature across releases.'
            elif [ -z "$MC_APPLE_CERTIFICATE" ] || [ -z "$MC_APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$MC_APPLE_SIGNING_IDENTITY" ]; then
              echo 'Set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY together, or leave all three unset.' >&2
              exit 1
            else
              export APPLE_CERTIFICATE="$MC_APPLE_CERTIFICATE"
              export APPLE_CERTIFICATE_PASSWORD="$MC_APPLE_CERTIFICATE_PASSWORD"
              export APPLE_SIGNING_IDENTITY="$MC_APPLE_SIGNING_IDENTITY"
              echo "Signing with identity: $APPLE_SIGNING_IDENTITY"
            fi
          fi
          npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          MC_APPLE_CERTIFICATE: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_CERTIFICATE || '' }}
          MC_APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          MC_APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      - name: Verify cloud helper inside macOS app
        if: startsWith(matrix.platform, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          HELPER="target/${{ matrix.target }}/release/bundle/macos/Manga Cleaner.app/Contents/MacOS/manga-cleaner-provisioner"
          test -x "$HELPER"
          "$HELPER" --self-check | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          test -x "target/${{ matrix.target }}/release/bundle/macos/Manga Cleaner.app/Contents/MacOS/manga-cleaner-uv"
      - name: Verify cloud helper inside Windows installer
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to inspect the NSIS installer' }
          $listing = & $sevenZip l -slt $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the NSIS installer' }
          foreach ($name in @('manga-cleaner-provisioner.exe', 'manga-cleaner-uv.exe', 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'bootstrap.py', 'export_mask.py', 'environment.txt')) {
            if (-not ($listing | Select-String -SimpleMatch -Quiet $name)) {
              throw "The Windows installer is missing $name"
            }
          }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw 'NSIS updater signature is missing' }
      - name: Smoke-test Windows install and reinstall
        if: startsWith(matrix.platform, 'windows-') && inputs.validate_only == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer is missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'Manga Café smoke'
          function Invoke-Nsis([string] $filePath, [string] $arguments) {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $filePath
            $startInfo.Arguments = $arguments
            $startInfo.UseShellExecute = $false
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "NSIS exited $($process.ExitCode): $filePath" }
          }
          function Install-App {
            Invoke-Nsis $installer.FullName "/S /D=$destination"
            $app = Get-ChildItem $destination -File -Filter '*.exe' | Where-Object { $_.Name -notmatch 'provisioner|uv|uninstall' } | Select-Object -First 1
            if (-not $app) { throw 'The installed app executable is missing' }
            foreach ($name in @('manga-cleaner-provisioner.exe', 'manga-cleaner-uv.exe')) {
              if (-not (Test-Path (Join-Path $destination $name))) { throw "The installed app is missing $name" }
            }
            return $app.FullName
          }
          function Uninstall-App([string] $app) {
            $uninstaller = Get-ChildItem $destination -File -Filter '*uninstall*.exe' | Select-Object -First 1
            if (-not $uninstaller) { throw 'The NSIS uninstaller is missing' }
            Invoke-Nsis $uninstaller.FullName '/S'
            for ($attempt = 0; $attempt -lt 30 -and (Test-Path $app); $attempt++) { Start-Sleep -Seconds 1 }
            if (Test-Path $app) { throw 'The app executable remains after uninstall' }
          }
          $app = Install-App
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
            $selfCheck = & (Join-Path $destination 'manga-cleaner-provisioner.exe') '--self-check' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $selfCheck.ok) { throw 'Installed provisioner self-check failed without developer tools on PATH' }
            & (Join-Path $destination 'manga-cleaner-uv.exe') '--version'
            if ($LASTEXITCODE -ne 0) { throw 'Installed managed Python helper did not run' }
          } finally { $env:PATH = $oldPath }
          Uninstall-App $app
          $app = Install-App
          Uninstall-App $app
      # The only step that opens the window on Windows. The app checks itself
      # (src-tauri/src/smoke.rs): the page mounts, a command answers, the tile
      # scheme answers a fetch, and the ONNX Runtime downloads and loads. It
      # writes a report and exits non-zero if any of that failed. Runs on every
      # build, tagged releases included. The install path is not ASCII on
      # purpose.
      - name: Launch smoke (Windows)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer is missing' }
          $destination = Join-Path $env:RUNNER_TEMP '漫画 launch'
          $out = Join-Path $env:RUNNER_TEMP 'launch-smoke'
          New-Item -ItemType Directory -Force $out | Out-Null
          $setup = [System.Diagnostics.Process]::Start([System.Diagnostics.ProcessStartInfo]@{
            FileName = $installer.FullName; Arguments = "/S /D=$destination"; UseShellExecute = $false })
          $setup.WaitForExit()
          if ($setup.ExitCode -ne 0) { throw "NSIS exited $($setup.ExitCode)" }
          $exe = Get-ChildItem $destination -File -Filter '*.exe' | Where-Object { $_.Name -notmatch 'provisioner|uv|uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'The installed app executable is missing' }
          $report = Join-Path $out 'report.json'
          $env:MANGA_CLEANER_SMOKE_REPORT = $report
          $env:MANGA_CLEANER_SMOKE_RUNTIME = '1'
          $app = [System.Diagnostics.Process]::Start([System.Diagnostics.ProcessStartInfo]@{
            FileName = $exe.FullName; UseShellExecute = $false })
          # The app holds its window for five seconds after writing the report.
          $deadline = (Get-Date).AddMinutes(20)
          while (-not (Test-Path $report) -and -not $app.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $report) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $out 'screenshot.png'))
            } catch { Write-Warning "screenshot failed: $_" }
          }
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw 'The app did not exit after its check' }
          Write-Host "app exit code: $($app.ExitCode)"
          if (-not (Test-Path $report)) { throw 'The app wrote no report' }
          Get-Content $report
          if ($app.ExitCode -ne 0) { throw "The launch check failed with exit code $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(matrix.platform, 'windows-')
        with:
          name: launch-smoke-windows
          path: ${{ runner.temp }}/launch-smoke
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Linux packages and bundled setup helpers
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          HELPER="src-tauri/binaries/manga-cleaner-provisioner-${{ matrix.target }}"
          test -x "$HELPER"
          "$HELPER" --self-check | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          DEB=$(find "target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          APPIMAGE=$(find "target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$APPIMAGE"
          test -s "$APPIMAGE.sig"
          APPIMAGE=$(realpath "$APPIMAGE")
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          dpkg-deb -x "$DEB" "$VERIFY_DIR/deb"
          (cd "$VERIFY_DIR" && "$APPIMAGE" --appimage-extract >/dev/null)
          for package in "$VERIFY_DIR/deb" "$VERIFY_DIR/squashfs-root"; do
            for helper in manga-cleaner-provisioner manga-cleaner-uv; do
              test -n "$(find "$package" -type f -name "$helper" -perm /111 -print -quit)" || {
                echo "$package: $helper missing or not executable" >&2; exit 1;
              }
            done
            for resource in 'sidecar/bootstrap.py' 'sidecar/pyproject.toml' 'sam-bootstrap/bootstrap.py' 'sam-bootstrap/export_mask.py' 'sam-bootstrap/environment.txt'; do
              test -n "$(find "$package" -type f -path "*/$resource" -print -quit)" || {
                echo "$package: $resource missing" >&2; exit 1;
              }
            done
          done
          dpkg-deb --field "$DEB" Depends
      - name: Collect updater artifacts
        shell: bash
        # Renamed to MangaCleaner_<version>_<platform>.<ext>: the platform tag keeps
        # the two mac architectures from clobbering each other under one R2 key, and
        # dropping the space in "Manga Cleaner" keeps update URLs unencoded-safe.
        #
        # NSIS only on Windows. The msi target used to be built and then left
        # behind here, paying for a WiX download and build on every release for
        # an artefact no user could ever reach; it is gone from
        # tauri.conf.json's bundle targets. The updater's Windows path wants
        # the NSIS installer in any case.
        run: |
          set -euo pipefail
          # node, not python3: the windows runner's git-bash has no reliable python3.
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Cargo's workspace target directory is at the repository root, not
          # under src-tauri. Tauri prints the completed bundle paths from this
          # location on every platform.
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          OUT="out/${{ matrix.platform }}"
          PREFIX="MangaCleaner_${VERSION}_${{ matrix.platform }}"
          mkdir -p "$OUT"
          case "${{ matrix.platform }}" in
            darwin-*)
              SRC=$(ls "$BUNDLE"/macos/*.app.tar.gz)
              cp "$SRC" "$OUT/$PREFIX.app.tar.gz"
              cp "$SRC.sig" "$OUT/$PREFIX.app.tar.gz.sig"
              DMG=$(ls "$BUNDLE"/dmg/*.dmg 2>/dev/null | head -1 || true)
              [ -n "$DMG" ] && cp "$DMG" "$OUT/$PREFIX.dmg"
              ;;
            windows-*)
              SRC=$(ls "$BUNDLE"/nsis/*-setup.exe)
              cp "$SRC" "$OUT/$PREFIX-setup.exe"
              cp "$SRC.sig" "$OUT/$PREFIX-setup.exe.sig"
              ;;
            linux-*)
              SRC=$(ls "$BUNDLE"/appimage/*.AppImage)
              cp "$SRC" "$OUT/$PREFIX.AppImage"
              cp "$SRC.sig" "$OUT/$PREFIX.AppImage.sig"
              DEB=$(ls "$BUNDLE"/deb/*.deb)
              cp "$DEB" "$OUT/$PREFIX.deb"
              ;;
          esac
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3

  # Opens the built Linux packages on clean distribution images, which is the
  # closest CI gets to a new computer: the .deb must pull its own dependencies,
  # and the AppImage must run with what a desktop already has. The app checks
  # itself (src-tauri/src/smoke.rs) and exits non-zero on a failure. The .deb
  # legs gate publishing. The AppImage legs report without gating until they
  # have passed once, because a bare container lacks libraries a desktop has
  # and the list is not settled. They run through APPIMAGE_EXTRACT_AND_RUN,
  # because Ubuntu 24.04 and Arch ship no libfuse2 (docs/windows-linux-audit-2026-09-29.md).
  smoke-linux:
    name: Launch smoke (${{ matrix.id }})
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.package == 'appimage' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-deb
            image: ubuntu:22.04
            package: deb
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb dbus imagemagick ca-certificates fonts-dejavu-core ./pkg/*.deb
          - id: ubuntu-24.04-deb
            image: ubuntu:24.04
            package: deb
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb dbus imagemagick ca-certificates fonts-dejavu-core ./pkg/*.deb
          - id: ubuntu-24.04-appimage
            image: ubuntu:24.04
            package: appimage
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb dbus imagemagick ca-certificates fonts-dejavu-core libegl1 libgl1 libgbm1
          - id: fedora-40-appimage
            image: fedora:40
            package: appimage
            setup: dnf -y install xorg-x11-server-Xvfb dbus-daemon ImageMagick ca-certificates dejavu-sans-fonts mesa-libEGL mesa-libGL mesa-libgbm findutils
          - id: arch-appimage
            image: archlinux:latest
            package: appimage
            setup: pacman -Syu --noconfirm --needed xorg-server-xvfb dbus imagemagick ca-certificates ttf-dejavu mesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: pkg
      - name: Install the package and a virtual display
        shell: bash
        run: ${{ matrix.setup }}
      - name: Launch smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = deb ]; then
            app=(manga-cleaner)
          else
            image=$(realpath "$(find pkg -maxdepth 1 -name '*.AppImage' -print -quit)")
            chmod +x "$image"
            export APPIMAGE_EXTRACT_AND_RUN=1
            app=("$image")
          fi
          bash .github/scripts/launch-smoke-linux.sh launch-smoke "${app[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-smoke-${{ matrix.id }}
          path: launch-smoke
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish to R2
    needs: [build, smoke-linux]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOTES="${{ github.event.inputs.notes }}"
          else
            git fetch --depth=1 origin +refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}
            NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          fi
          # Lightweight tags have no message; don't publish empty notes.
          [ -n "$NOTES" ] || NOTES="Release ${GITHUB_REF_NAME:-$(date -u +%Y-%m-%d)}"
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build latest.json and upload
        shell: bash
        # python3 here and not node, unlike the build job: this job runs on
        # ubuntu-latest, where python3 is the reliable one.
        env:
          CLEANER_PUBLISH_TOKEN: ${{ secrets.CLEANER_PUBLISH_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${VERSION} - bump the version before tagging" >&2
            exit 1
          fi
          BASE_URL="https://cleaner.komiq.cc"
          echo "== publishing v$VERSION =="

          python3 - "$VERSION" <<'PY'
          import json, os, sys, glob, datetime
          version = sys.argv[1]
          base = "https://cleaner.komiq.cc"
          platforms = {}
          uploads = []  # (local, remote)
          for pdir in sorted(glob.glob("artifacts/*")):
              platform = os.path.basename(pdir)
              sigs = glob.glob(pdir + "/*.sig")
              if not sigs:
                  sys.exit(f"no signature in {pdir}")
              sig = sigs[0]
              artifact = sig[:-4]
              fname = os.path.basename(artifact)
              remote = f"releases/v{version}/{fname}"
              platforms[platform] = {
                  "signature": open(sig).read().strip(),
                  "url": f"{base}/{remote}",
              }
              uploads.append((artifact, remote))
              for extension in ("dmg", "deb"):
                  for extra in glob.glob(pdir + f"/*.{extension}"):
                      uploads.append((extra, f"releases/v{version}/{os.path.basename(extra)}"))
          out = {
              "version": version,
              "notes": os.environ.get("RELEASE_NOTES", "").strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          json.dump(out, open("latest.json", "w"), indent=2)
          json.dump([list(u) for u in uploads], open("uploads.json", "w"))
          print(json.dumps(out, indent=2))
          PY

          python3 -c "import json; [print(f'{l}\t{r}') for l, r in json.load(open('uploads.json'))]" | while IFS=$'\t' read -r LOCAL REMOTE; do
            echo "uploading $REMOTE"
            curl -sSf -X PUT -H "Authorization: Bearer $CLEANER_PUBLISH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$LOCAL" "https://cleaner-publish.komiq.cc/$REMOTE"
          done
          echo "uploading latest.json"
          curl -sSf -X PUT -H "Authorization: Bearer $CLEANER_PUBLISH_TOKEN" -H "Content-Type: application/json" --data-binary @latest.json "https://cleaner-publish.komiq.cc/latest.json"
          echo "== published: $BASE_URL/latest.json =="
