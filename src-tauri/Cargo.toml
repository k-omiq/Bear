[package]
name = "manga-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Remove Chinese, Japanese, and Korean text from comic pages without touching anything else"

[lib]
# `staticlib`/`cdylib` are what a mobile target would link; `rlib` is what the
# integration tests use. Kept as Tauri scaffolds it even though only desktop
# ships, because dropping them is a change to make when mobile is ruled out in
# writing, not silently here.
name = "manga_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true
sha2 = "0.10"

[dependencies]
cleaner-core = { path = "../crates/cleaner-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# `tile::TileError` maps a failure to an HTTP status, so its variants have to
# stay distinguishable rather than collapsing into one `anyhow::Error`.
thiserror.workspace = true
# Only for the build string in diagnostics; every session lives in cleaner-core.
ort = { workspace = true, features = ["std", "load-dynamic", "api-22"] }
# The in-app model downloader (`weights.rs`). `blocking` because
# every download runs on a thread of its own and streams straight to disk;
# nothing here belongs on the invoke handler's runtime. No TLS feature is named:
# reqwest 0.13's default is rustls and `tauri-plugin-updater` already puts this
# exact version in the graph, so the downloader adds a feature rather than a
# dependency tree.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# The pinned digests, verified from the bytes as they are written.
sha2 = "0.10"
base64 = "0.22"
png = "0.18"
# Unpacking the ONNX Runtime archive: a `.tgz` on macOS and Linux, a `.nupkg`
# (which is a zip) on Windows. Both are already in the lockfile - the updater
# plugin unpacks its own artefacts with them.
tar = "0.4"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Cryptographic nonce generation for inference authorization grants
getrandom = "0.3"
# Compiler-barrier memory zeroization for sensitive cloud credentials
zeroize = { version = "1", features = ["derive"] }
url = "2"

# The Hugging Face token, in the operating system's own credential store rather
# than in `settings.json`. `keyring` 3 compiles no platform
# backend unless one is named, so each platform names its own below and a
# platform that names none - or a machine whose store will not answer - falls
# back to the settings file at runtime, which is what `weights::read_token`
# decides.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The same Security.framework binding `keyring` already uses, named so the cloud
# credential summary can ask whether an item exists without reading its data.
# Reading the data is what the keychain's per-build access list guards, so an
# existence check that reads it prompts after every unsigned update.
security-framework = "3"
# Data passed to Security.framework when replacing a password without reading it.
core-foundation = "0.10"
# `NSColorSampler`, the system's own screen eyedropper, for the colour picker:
# `WKWebView` has no `EyeDropper`. All three crates are already in the graph
# through `tauri`, at these versions; naming them adds features, not a tree.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSColor", "NSColorSampler", "NSColorSpace"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Match the WebView2 types used by Tauri/Wry for native reload protection.
webview2-com = "0.38"
windows-core = "0.61"
keyring = { version = "3", features = ["windows-native"] }
# Two Windows facts this crate cannot get from `std`, both of which were being
# guessed at or skipped before.
#
# `GetDiskFreeSpaceExW` is the free-space preflight the runtime download makes:
# the CUDA archives are 365-455 MB and unpack to more again, and a transfer that
# runs the volume dry halfway through leaves a `.part`, a wiped staging
# directory and no explanation. It answers what the *caller* may write, which is
# the figure a quota-limited account actually has.
#
# The security entry points are what gives `settings.json` a DACL. The mode bits
# `restrict` sets on unix mean nothing here, and that file holds the Hugging
# Face token on a machine whose Credential Manager will not answer.
#
# `windows-sys` rather than a wrapper crate, and 0.61 rather than a newer major,
# because the lockfile already carries exactly that version through the graph
# `tauri` and `keyring` bring in: this adds an entry point, not a dependency
# tree. The bindings are declarations only - there is no code in them to audit.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# `statvfs`, for the same free-space preflight on macOS and Linux. Already in
# the lockfile several times over; naming it here is what makes it callable.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Two stores, because a Linux desktop has the Secret Service and a headless
# Linux box has only the kernel keyring. `crypto-rust` is what encrypts the
# Secret Service session; the alternative pulls in OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "linux-native"] }

# Test-only. The library's own tests build a folder of real JPEGs to prove that
# a chapter can be created from one; the crate itself never encodes an image in
# a format it does not export (`cleaner_core::image::foreign`).
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
