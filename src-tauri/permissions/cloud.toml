    "delete_project",
    "delete_chapter",
    "delete_mask",
    "restore_region",
    "set_layer_style",
    "keep_dependency_result",
    "set_detection_type",
    "apply_tool",
    "create_region",
    "preview_paint",
    "edit_detection_mask",
    "set_detection_padding",
    "rerun_mask",
    "clean_anyway",
    "sidecar_available",
    "list_sidecar_models",
    "pick_screen_color",
    "install_flux_helper",
    "export_chapter",
    "plan_export_chapter",
    "subscribe_events",
    "unsubscribe_events",
    "list_loaded_models",
    "unload_model",
    "list_accelerators",
    "list_workflow_capabilities",
    "import_full_rt",
    "remove_full_rt",
    "import_sam_ts",
    "install_sam_ts",
    "remove_sam_ts",
    "verify_sam_ts",
    "analyze_capabilities",
    "analyze_chapter_page",
    "cancel_capability_analysis",
    "load_component_correction",
    "prepare_component_write",
    "apply_component_write",
    "list_models",
    "download_model",
    "download_model_group",
    "cancel_download",
    "delete_model",
    "delete_model_group",
    "discard_partial",
    "verify_model",
    "verify_model_group",
    "download_runtime",
    "delete_runtime",
    "run_clean",
    "cancel_run",
    "resume_job",
    "denoise_chapter_local",
    "cancel_denoise_local",
    "benchmark_denoise_local",
    "denoise_presets",
    "replace_with_denoised",
    "denoise_history",
    "denoise_compare_image",
    "list_jobs",
    "confirm_quit",
    "hide_to_tray",
